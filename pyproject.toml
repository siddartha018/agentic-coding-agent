[project]
name = "coding-agent"
version = "0.1.0"
description = "SWE-agent style coding assistant with Python-subprocess sandboxed tool use and a 20-task mini-bench."
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0.6",
    "langchain-core>=0.3",
    "langchain-groq>=0.2",
    "groq>=0.11",
    "google-genai>=1.0",
    "qdrant-client[fastembed]>=1.12",
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "langfuse>=3.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sse-starlette>=2.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "python-dotenv>=1.0",
    "ddgs>=9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7"]

[project.scripts]
coding-agent = "coding_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coding_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
